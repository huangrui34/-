[tool:pytest]
# 测试配置
testpaths = 
    tests/unit
    tests/integration
    tests/e2e
    tests/performance

python_files = 
    test_*.py
    *_test.py

python_classes = 
    Test*
    *Test

python_functions = 
    test_*
    *_test

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

log_file = tests/test_results.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 测试执行配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --durations=10
    --color=yes

# 标记配置
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    performance: 性能测试
    slow: 慢速测试
    network: 需要网络连接
    adb: 需要ADB连接
    tv: 需要电视机
    skip: 跳过测试

# 过滤配置
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# 测试超时配置（秒）
timeout = 300
timeout_method = thread

# 测试发现配置
norecursedirs = 
    .git
    .idea
    .vscode
    __pycache__
    *.egg-info
    build
    dist
    node_modules
    venv
    .env

# 测试报告配置
junit_suite_name = TV_Launcher_Tests
junit_logging = all
junit_duration_report = call

# 覆盖率配置（如果启用）
# --cov=backend_server.app
# --cov-report=html
# --cov-report=term-missing
# --cov-fail-under=80